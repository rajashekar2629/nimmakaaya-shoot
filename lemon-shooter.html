<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lemon Shooter</title>
<style>
:root{--bg:#f4f1e8;--panel:#ffffff;--ink:#222222;--line:#d8d2c0;--accent:#e0a800;--btn:#f0ead6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15171c;--panel:#22252d;--ink:#eeeeee;--line:#3a3e49;--accent:#f2c744;--btn:#2e323d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171c;--panel:#22252d;--ink:#eeeeee;--line:#3a3e49;--accent:#f2c744;--btn:#2e323d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
display:flex;align-items:center;justify-content:center;gap:12px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{width:min(calc(100vw - 118px),calc((100vh - 40px) * 0.5625));aspect-ratio:9/16;height:auto;border-radius:14px;
border:3px solid var(--line);touch-action:none;display:block;cursor:crosshair}
.side{display:flex;flex-direction:column;gap:10px;width:86px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.card small{display:block;font-size:11px;opacity:.65;letter-spacing:.04em;text-transform:uppercase}
.card b{font-size:26px;color:var(--accent)}
button{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--btn);border:1px solid var(--line);
border-radius:12px;padding:12px 4px;cursor:pointer;touch-action:manipulation}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.4;cursor:default}
.hint{font-size:11px;line-height:1.35;opacity:.7;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="side">
  <div class="card"><small>Score</small><b id="score">0</b></div>
  <div class="card"><small>Best</small><b id="best">0</b></div>
  <button id="bRestart">Restart</button>
  <button id="bStop">Stop</button>
  <button id="bResume" disabled>Resume</button>
  <div class="hint">Drag to aim.<br>Tap the gun or press S to shoot.</div>
</div>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=360,H=640,GY=612,PX=180,PY=598,MUZ=68;
var dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
var state,lemons,bullets,parts,score,best=0,elapsed,spawnT,angle,recoil,cool,hintT;
try{best=+localStorage.getItem('lemonBest')||0}catch(e){}
var $score=document.getElementById('score'),$best=document.getElementById('best');
var bR=document.getElementById('bRestart'),bS=document.getElementById('bStop'),bP=document.getElementById('bResume');
function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function reset(){
  state='running';lemons=[];bullets=[];parts=[];score=0;elapsed=0;spawnT=.4;angle=0;recoil=0;cool=0;hintT=0;
  ui();
}
function ui(){
  $score.textContent=score;$best.textContent=best;
  bS.disabled=state!=='running';bP.disabled=state!=='paused';
}
function spawn(){
  var s=rand(.6,1.1);
  lemons.push({x:rand(40,W-40),y:-40,r:20,s:s,target:s,next:rand(.2,1),rot:rand(0,6.28),vr:rand(-1.2,1.2),vy:rand(42,68)});
}
function rad(l){return l.r*l.s}

function shoot(){
  if(state!=='running'||cool>0)return;
  cool=.22;recoil=1;
  var dx=Math.sin(angle),dy=-Math.cos(angle);
  bullets.push({x:PX+dx*MUZ,y:PY+dy*MUZ,dx:dx,dy:dy});
}

function burst(x,y,r){
  for(var i=0;i<14;i++){
    var a=rand(0,6.28),v=rand(60,220);
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-40,life:rand(.4,.8),t:0,c:i%3?'#fdd835':'#cddc39',s:rand(2,4)+r*.05});
  }
}

function update(dt){
  elapsed+=dt;if(hintT<6)hintT+=dt;
  if(cool>0)cool-=dt;
  if(recoil>0)recoil=Math.max(0,recoil-dt*6);
  var k=0;
  if(keys.ArrowLeft||keys.a)k-=1;
  if(keys.ArrowRight||keys.d)k+=1;
  if(k)angle=clamp(angle+k*2.4*dt,-Math.PI/2,Math.PI/2);

  spawnT-=dt;
  if(spawnT<=0){spawn();spawnT=rand(.8,1.7)*Math.max(.5,1-elapsed/150)}
  var ramp=Math.min(elapsed*.7,70);

  for(var i=lemons.length-1;i>=0;i--){
    var l=lemons[i];
    l.next-=dt;
    if(l.next<=0){
      l.target=Math.random()<.5?rand(1.4,2):rand(.5,.85);
      l.next=rand(.25,1.7);
    }
    l.s+=(l.target-l.s)*(1-Math.exp(-14*dt));
    l.y+=(l.vy+ramp)*dt;
    l.rot+=l.vr*dt;
    var r=rad(l);
    l.x=clamp(l.x,r,W-r);
    if(l.y+r>=GY){gameOver();return}
  }

  for(var b=bullets.length-1;b>=0;b--){
    var u=bullets[b];
    u.x+=u.dx*760*dt;u.y+=u.dy*760*dt;
    var hit=false;
    for(var j=lemons.length-1;j>=0;j--){
      var m=lemons[j];
      if(Math.hypot(u.x-m.x,u.y-m.y)<rad(m)*1.1+4){
        burst(m.x,m.y,rad(m));lemons.splice(j,1);
        score++;if(score>best){best=score;try{localStorage.setItem('lemonBest',best)}catch(e){}}
        ui();hit=true;break;
      }
    }
    if(hit||u.x<-20||u.x>W+20||u.y<-20||u.y>H+20)bullets.splice(b,1);
  }
  for(var p=parts.length-1;p>=0;p--){
    var q=parts[p];q.t+=dt;q.vy+=420*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(q.t>q.life)parts.splice(p,1);
  }
}
function gameOver(){state='over';ui()}

/* ---------- drawing ---------- */
function drawLemon(l){
  var r=rad(l),a=r*1.2,b=r*.9,tip=a+r*.25;
  ctx.save();ctx.translate(l.x,l.y);ctx.rotate(l.rot);
  ctx.beginPath();ctx.moveTo(-tip,0);
  ctx.quadraticCurveTo(-a*.8,-b*1.3,0,-b);
  ctx.quadraticCurveTo(a*.8,-b*1.3,tip,0);
  ctx.quadraticCurveTo(a*.8,b*1.3,0,b);
  ctx.quadraticCurveTo(-a*.8,b*1.3,-tip,0);
  ctx.closePath();
  var g=ctx.createRadialGradient(-r*.3,-r*.3,r*.1,0,0,r*1.4);
  g.addColorStop(0,'#fff59d');g.addColorStop(.55,'#fdd835');g.addColorStop(1,'#f9a825');
  ctx.fillStyle=g;ctx.fill();
  ctx.lineWidth=1.5;ctx.strokeStyle='#c58a00';ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.beginPath();ctx.ellipse(-r*.3,-r*.35,r*.35,r*.14,-.4,0,6.28);ctx.fill();
  ctx.restore();
}

function firstHit(ox,oy,dx,dy){
  var best=1e9;
  for(var i=0;i<lemons.length;i++){
    var l=lemons[i],fx=l.x-ox,fy=l.y-oy,pr=fx*dx+fy*dy;
    if(pr<0)continue;
    var R=rad(l)*1.1,pp=fx*fx+fy*fy-pr*pr;
    if(pp<=R*R){var t=pr-Math.sqrt(R*R-pp);if(t<best)best=t}
  }
  return best;
}

function drawGun(){
  ctx.save();ctx.translate(PX,PY);
  ctx.fillStyle='#3a3f4b';
  ctx.beginPath();ctx.arc(0,0,32,Math.PI,0);ctx.lineTo(32,14);ctx.lineTo(-32,14);ctx.closePath();ctx.fill();
  ctx.save();ctx.rotate(angle);
  var rc=recoil*8;
  ctx.fillStyle='#8a93a6';ctx.fillRect(-9,-MUZ+8+rc,18,MUZ-8);
  ctx.fillStyle='#5b6376';ctx.fillRect(-12,-MUZ+rc,24,12);
  ctx.fillStyle='#222';ctx.fillRect(-4,-MUZ-1+rc,8,3);
  ctx.restore();
  ctx.fillStyle='#e0a800';ctx.beginPath();ctx.arc(0,0,11,0,6.28);ctx.fill();
  ctx.strokeStyle='#3a3f4b';ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
}

function draw(){
  var sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#87cdf0');sky.addColorStop(1,'#e8f7ff');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#5a8f3c';ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle='#46752d';ctx.fillRect(0,GY,W,4);

  for(var i=0;i<lemons.length;i++)drawLemon(lemons[i]);

  /* aim line: stops at the first lemon it meets */
  var dx=Math.sin(angle),dy=-Math.cos(angle),ox=PX+dx*MUZ,oy=PY+dy*MUZ;
  var t=firstHit(ox,oy,dx,dy),len=t<1e8?t:900;
  ctx.save();
  ctx.strokeStyle='rgba(230,40,40,.85)';ctx.lineWidth=2;ctx.setLineDash([8,6]);
  ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+dx*len,oy+dy*len);ctx.stroke();
  ctx.setLineDash([]);
  if(t<1e8){
    var ex=ox+dx*len,ey=oy+dy*len;
    ctx.beginPath();ctx.arc(ex,ey,9,0,6.28);ctx.stroke();
    ctx.beginPath();ctx.arc(ex,ey,2.5,0,6.28);ctx.fillStyle='rgba(230,40,40,.9)';ctx.fill();
  }
  ctx.restore();

  ctx.fillStyle='#333';
  for(var b=0;b<bullets.length;b++){ctx.beginPath();ctx.arc(bullets[b].x,bullets[b].y,4,0,6.28);ctx.fill()}
  for(var p=0;p<parts.length;p++){
    var q=parts[p];ctx.globalAlpha=1-q.t/q.life;ctx.fillStyle=q.c;
    ctx.beginPath();ctx.arc(q.x,q.y,q.s,0,6.28);ctx.fill();
  }
  ctx.globalAlpha=1;
  drawGun();

  ctx.textAlign='center';
  if(hintT<5&&state==='running'){
    ctx.globalAlpha=Math.min(1,(5-hintT));ctx.fillStyle='rgba(0,0,0,.6)';ctx.font='600 14px system-ui,sans-serif';
    ctx.fillText('Drag to aim · tap the gun to shoot',W/2,34);ctx.globalAlpha=1;
  }
  if(state!=='running'){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';ctx.font='700 36px system-ui,sans-serif';
    if(state==='paused'){ctx.fillText('Paused',W/2,H/2)}
    else{
      ctx.fillText('Game Over',W/2,H/2-14);
      ctx.font='600 20px system-ui,sans-serif';
      ctx.fillText('Score: '+score+'   Best: '+best,W/2,H/2+22);
      ctx.font='500 14px system-ui,sans-serif';
      ctx.fillText('Press Restart to play again',W/2,H/2+52);
    }
  }
}

/* ---------- input ---------- */
var keys={};
function pt(e){var r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
function aim(x,y){
  var best=null,bd=1e9;
  for(var i=0;i<lemons.length;i++){
    var l=lemons[i],d=Math.hypot(x-l.x,y-l.y);
    if(d<=rad(l)*1.3&&d<bd){bd=d;best=l}
  }
  if(best){x=best.x;y=best.y}
  var dx=x-PX,dy=PY-y;
  angle=clamp(Math.atan2(dx,dy),-Math.PI/2,Math.PI/2);
}
function onGun(x,y){return Math.hypot(x-PX,y-PY)<44}
var aimIds={};
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();var p=pt(e);
  if(onGun(p[0],p[1])){shoot();return}
  aimIds[e.pointerId]=1;try{cv.setPointerCapture(e.pointerId)}catch(x){}
  aim(p[0],p[1]);
});
cv.addEventListener('pointermove',function(e){
  if(!(aimIds[e.pointerId]||e.pointerType==='mouse'))return;
  var p=pt(e);if(!onGun(p[0],p[1]))aim(p[0],p[1]);
});
function endP(e){delete aimIds[e.pointerId]}
cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);
window.addEventListener('keydown',function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k==='s'){shoot();e.preventDefault()}
  else if(k==='a'||k==='d'||k==='ArrowLeft'||k==='ArrowRight'){keys[k]=true;e.preventDefault()}
});
window.addEventListener('keyup',function(e){
  var k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;
});
bR.onclick=reset;
bS.onclick=function(){if(state==='running'){state='paused';ui()}};
bP.onclick=function(){if(state==='paused'){state='running';ui()}};

var last=0;
function loop(ts){
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(state==='running')update(dt);
  draw();requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
